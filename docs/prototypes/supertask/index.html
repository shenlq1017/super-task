<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperTask · 本机多服务工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <!-- ===== Chrome (titlebar) ===== -->
  <header class="chrome">
    <div class="chrome-title">SuperTask · 本机多服务可视化工作台</div>
    <div class="chrome-win">
      <button class="wctl min" title="最小化" aria-label="最小化"><svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6"/></svg></button>
      <button class="wctl max" title="最大化" aria-label="最大化"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
      <button class="wctl close" title="关闭" aria-label="关闭"><svg viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9"/><line x1="9" y1="3" x2="3" y2="9"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="workspace" id="wsBtn" aria-label="切换工作区">
        <div class="ws-mark">M</div>
        <div class="meta">
          <div class="ws-name">mall</div>
          <div class="ws-path">D:/dev/mall</div>
        </div>
        <svg class="ws-chev icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <nav class="nav" id="nav" aria-label="主导航"></nav>
      <div class="sb-foot">
        <button class="collapse-btn" id="collapseBtn" aria-label="收起侧栏">
          <svg class="chev icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          <span class="lbl">收起</span>
        </button>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">
      <div class="pagehead">
        <div class="ttl" id="phTtl">运行</div>
        <div class="sub" id="phSub"></div>
        <div class="spacer"></div>
        <div class="search-trigger" id="searchTrigger" role="button" tabindex="0">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <span>搜索命令…</span>
          <span class="kbd">⌘K</span>
        </div>
        <button class="icon-btn" id="acctBtn" title="账号（即将 2.0）" aria-label="账号">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </button>
      </div>
      <div class="content" id="view"></div>
    </main>
  </div>

  <!-- ===== Status bar ===== -->
  <footer class="statusbar" id="statusbar"></footer>
</div>

<!-- ===== Command palette ===== -->
<div class="cp-backdrop" id="cpBack"></div>
<div class="cp" id="cp" role="dialog" aria-label="命令面板">
  <div class="cp-input">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="cpInput" placeholder="跳转到页面或运行操作…" autocomplete="off">
  </div>
  <div class="cp-list" id="cpList"></div>
</div>

<!-- ===== Modal host ===== -->
<div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<!-- ===== Toasts ===== -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
  window.__loadErr = '';
  window.addEventListener('error', function(e){ window.__loadErr = (e.message||'') + ' @ ' + (e.filename||'') + ':' + (e.lineno||''); });
  window.addEventListener('unhandledrejection', function(e){ window.__loadErr = 'REJECT: ' + (e.reason && e.reason.message || e.reason); });
</script>
<script src="app.js"></script>
</body>
</html>
