[package]
name = "supertask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SuperTask desktop shell. Thin IPC adapter over supertask-core."

[lib]
name = "supertask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
supertask-core = { path = "../crates/supertask-core" }
# tray-icon：系统托盘（TrayIconBuilder/MenuBuilder 均内置，无需插件）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 开机启动：Rust 侧 ManagerExt::autolaunch().enable()/disable()，无需前端 ACL
tauri-plugin-autostart = "2"
# 自动更新：Rust 侧 UpdaterExt::updater_builder().build().check() + Update::download/install
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
