<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!-- SuperTask 终稿 K · 日食轨道
    主旨：中央星核 = 当前工作区 / 服务；紫色轨道 = 网关守望；缺口 + 绿彗星 = 正在运行的任务从缺口切入。
    配色：底 #191B20 与运行页命令行块同源；环 #5E6AD2 品牌主色；核白 + #7B84EA 内环；彗星 #27A644 运行语义。
    缺口居中对齐彗星（rotate -20°），16px 剪影为 环 + 核 + 点，三元素不粘连。 -->
  <rect width="1024" height="1024" rx="232" fill="#191B20"/>
  <rect x="32" y="32" width="960" height="960" rx="200" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>
  <g transform="rotate(-20 512 512)">
    <circle cx="512" cy="512" r="242" stroke="#5E6AD2" stroke-width="112" stroke-linecap="round" stroke-dasharray="1300 220" fill="none"/>
  </g>
  <circle cx="512" cy="512" r="120" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="120" stroke="#7B84EA" stroke-opacity="0.55" stroke-width="18" fill="none"/>
  <circle cx="688" cy="330" r="84" fill="#27A644"/>
  <circle cx="688" cy="330" r="84" stroke="#FFFFFF" stroke-width="28" fill="none"/>
</svg>
