name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已有 Release tag，仅镜像到 CNB（如 v0.2.0）"
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    outputs:
      release_id: ${{ steps.build.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      - run: npm --prefix frontend ci

      - uses: dtolnay/rust-toolchain@stable

      # 发布说明：按 tag 版本号提取 CHANGELOG.md 对应段落，
      # tauri-action 会写入 GitHub Release body，并同步为 latest.json 的 notes（应用内更新弹窗展示）。
      - name: Extract changelog for release notes
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md | sed -e '/./,$!d')
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          test -n "$body" || echo "::warning::CHANGELOG.md 中未找到 [${version}] 段落，发布说明为空"

      - name: Build and publish Windows bundles
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SuperTask ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false

  # macOS / Linux 产物（方向八 M2）：进 windows 创建的同一个 draft Release。
  # 未签名（公证待 M3），因此不写 latest.json（includeUpdaterJson=false），
  # 已验证的 Windows 自动更新链路使用的 latest.json 不受多平台构建影响。
  macos:
    if: github.event_name == 'push'
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 原生构建（macos-14 起 runner 为 arm64）
          # ponytail: Intel macOS runner 排队过久会阻塞 CNB 镜像，暂移除 x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      - run: npm --prefix frontend ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build macOS bundles (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.windows.outputs.release_id }}
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

  linux:
    if: github.event_name == 'push'
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    needs: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      - run: npm --prefix frontend ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 22.04 自带 libfuse2（AppImage 打包工具 linuxdeploy 需要）；
      # 在旧 glibc 上构建以兼顾用户侧发行版兼容面。
      - name: install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2

      - name: Build Linux bundles (AppImage / deb)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.windows.outputs.release_id }}
          includeUpdaterJson: false
          args: --bundles appimage,deb

  # 把发布产物镜像到 cnb.cool（国内更新端点）：
  # 检测/下载走固定滚动 tag `stable`，端点 URL 恒为
  # https://cnb.cool/sweetshuyan/super-task/-/releases/download/stable/latest.json
  # 上传分两阶段：先 Windows 更新通道（latest.json + 安装包），再其余平台分发包。
  mirror-to-cnb:
    name: Mirror release to CNB
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.windows.result == 'success' &&
          needs.macos.result == 'success' &&
          needs.linux.result == 'success'
        )
      )
    env:
      CNB_SLUG: sweetshuyan/super-task
      CNB_API: https://api.cnb.cool
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download GitHub release assets（draft 也可下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" --dir dist --clobber
          ls -la dist

      - name: Rewrite latest.json download URLs to CNB (stable)
        run: |
          python3 - <<'PY'
          import json, pathlib
          base = "https://cnb.cool/sweetshuyan/super-task/-/releases/download/stable"
          p = pathlib.Path("dist/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          for info in data.get("platforms", {}).values():
              name = info.get("url", "").rstrip("/").rsplit("/", 1)[-1]
              info["url"] = f"{base}/{name}"
          p.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: "Create/update CNB release (tag: stable) and upload assets"
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          TAG: stable
        run: |
          set -euo pipefail
          slug="$CNB_SLUG"; api="$CNB_API"
          auth=( -H "Authorization: Bearer $CNB_TOKEN" -H "Accept: application/json" )

          release_id=$(curl -sf "${auth[@]}" "$api/$slug/-/releases/tags/$TAG" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' 2>/dev/null) || release_id=""
          if [ -z "$release_id" ]; then
            echo "CNB 上不存在 $TAG 的 Release，创建中…"
            release_id=$(curl -sf -X POST "${auth[@]}" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"main\",\"name\":\"SuperTask stable\",\"draft\":false,\"make_latest\":\"true\"}" \
              "$api/$slug/-/releases" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          echo "CNB release_id=$release_id"
          # 刷新标题/描述，便于在 CNB 页面上看到当前稳定版本
          curl -sf -X PATCH "${auth[@]}" -H "Content-Type: application/json" \
            -d "{\"name\":\"SuperTask $RELEASE_TAG (stable)\",\"body\":\"自动更新稳定通道，同步自 GitHub $RELEASE_TAG\"}" \
            "$api/$slug/-/releases/$release_id" >/dev/null || true

          upload_one() {
            local f="$1"
            local name size up upload_url verify_url code
            name=$(basename "$f"); size=$(stat -c%s "$f")
            echo "上传 $name（$size 字节）…"
            up=$(curl -sf --max-time 120 -X POST "${auth[@]}" -H "Content-Type: application/json" \
              -d "{\"asset_name\":\"$name\",\"size\":$size,\"overwrite\":true}" \
              "$api/$slug/-/releases/$release_id/asset-upload-url")
            upload_url=$(printf '%s' "$up" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"])')
            verify_url=$(printf '%s' "$up" | python3 -c 'import json,sys; print(json.load(sys.stdin)["verify_url"])')
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 30 --max-time 1800 --retry 5 --retry-delay 15 --retry-all-errors \
              -X PUT --data-binary @"$f" -H "Content-Type: application/octet-stream" "$upload_url")
            echo "预签名上传 HTTP $code"
            [ "$code" = "200" ] || { echo "上传失败：$name"; exit 1; }
            curl -sf --max-time 120 -X POST "${auth[@]}" "$verify_url" >/dev/null
            echo "已确认 $name"
          }

          echo "== 阶段 1/2：Windows 自动更新通道 =="
          for f in dist/latest.json dist/SuperTask_*_x64*.msi dist/SuperTask_*_x64*.exe; do
            [ -e "$f" ] || continue
            upload_one "$f"
          done

          echo "== 阶段 2/2：其余平台分发包 =="
          for f in dist/*; do
            name=$(basename "$f")
            case "$name" in
              latest.json|SuperTask_*_x64*.msi|SuperTask_*_x64*.exe) continue ;;
            esac
            upload_one "$f"
          done
          echo "国内更新端点：https://cnb.cool/$slug/-/releases/download/stable/latest.json"
