# 内置模板清单：字段与创建行为见 docs/archive/plans/2026-08-28-templates-upgrade-plan.md §3.1
# 本文件是模板元数据真源；files 与目录内实际文件的双向一致性由单元测试兜底。
id: spring-boot-single
version: "1"
name: Spring Boot 单模块
description: 最简单的 Spring Boot Web 应用，module 为 "."，直接 mvn spring-boot:run 启动
stacks:
  - spring-boot
files:
  - pom.xml
  - src/main/java/com/supertask/demo/DemoApplication.java
  - src/main/resources/application.properties
  - supertask.yaml
params:
  - key: project_name
    label: 项目名
    required: false
    apply_to:
      - yaml.name
