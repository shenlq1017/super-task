# SuperTask 官方模板：frp 客户端（frpc）
# token 只经 .env.frp（env_file）注入进程环境；frpc.toml 用
# {{ .Envs.FRP_TOKEN }} 引用，不写死任何凭据。
version: 1
kind: workspace
name: tunnel-frpc
description: frp 客户端，把本机 {{target_port}} 端口经 frps 暴露到远端 {{frp_remote_port}} 端口
root: "."
services:
  tunnel:
    kind: generic
    program: frpc
    args:
      - -c
      - frpc.toml
    env_file:
      - .env.frp
    restart: on-failure
    health:
      type: none
