# 内置组合模板清单：blocks 语义见 docs/plans/2026-08-28-templates-upgrade-plan.md Phase 4
# 组合模板不携带 supertask.yaml——生成物由选中块的 services 片段拼装；
# 片段中 {{port}} 占位在端口分配时一并替换（如 health URL）。
id: spring-node-combo
version: "1"
name: Spring + Node（自由组合）
description: 按需组合 Spring Boot 后端与 Node 前端，向导中勾选服务块并分配端口
stacks:
  - spring-boot
  - node
blocks:
  - id: backend
    label: Spring Boot 后端
    kind: spring-boot
    requires: []
    default_port: 8081
    files:
      - pom.xml
      - backend/pom.xml
      - backend/src/main/java/com/supertask/demo/DemoApplication.java
      - backend/src/main/resources/application.properties
    services:
      backend:
        kind: spring-boot
        module: backend
        health:
          type: http
          http: "http://127.0.0.1:{{port}}/actuator/health"
  - id: web
    label: Node 前端
    kind: node
    requires:
      - backend
    default_port: 5173
    files:
      - web/package.json
      - web/server.js
    services:
      web:
        kind: node
        dir: web
        depends_on:
          - backend
        health:
          type: tcp
