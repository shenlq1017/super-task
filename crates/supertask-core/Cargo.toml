[package]
name = "supertask-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SuperTask engine: spec, runtime, logs, IPC types. No Tauri dependency."

[dependencies]
# 系统监听端口枚举（GetExtendedTcpTable 封装，IPv4/IPv6；替代手解 TCP 表）
netstat2 = "0.9"

indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

# 1.1 内置模板：编译期嵌入目录树（离线分发，无需运行时解包）
include_dir = "0.7"

# Windows 子进程混输 GBK（cmd 批处理/包装脚本 echo 中文）时的行解码兜底
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_Security",
] }
