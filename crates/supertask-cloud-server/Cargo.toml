[package]
name = "supertask-cloud-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal self-hostable SuperTask cloud reference server"

[[bin]]
name = "supertask-cloud-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
sqlx = { version = "0.8", features = ["sqlite"] }
tower = "0.5"
